<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Audio Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'pixel': ['Dogica', 'cursive'],
                    },
                }
            }
        }
    </script>
    <style>
        @font-face {
            font-family: 'Dogica';
            src: url(/static/font/dogica.ttf) format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'Dogica', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 0px;
            border: 3px solid black;
            box-shadow: 6px 6px 0px black;
            max-width: 800px;
            margin: 40px auto;
        }
        .search-box {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 12px;
            font-family: 'Dogica', sans-serif;
            border: 3px solid black;
            border-radius: 0px;
            outline: none;
        }
        button {
            padding: 10px 20px;
            background-color: black;
            color: white;
            border: 3px solid black;
            border-radius: 0px;
            cursor: pointer;
            font-size: 80% !important;
            font-family: 'Dogica', sans-serif;
            box-shadow: 4px 4px 0px #555;
        }
        button:hover {
            background-color: #ffffff;
            box-shadow: 2px 2px 0px #555;
            transform: translate(2px, 2px);
        }
        #results {
            margin-top: 30px;
        }
        .video-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border: 3px solid black;
            border-radius: 0px;
            box-shadow: 4px 4px 0px black;
        }
        .video-item img {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            border-radius: 0px;
            border: 2px solid black;
            image-rendering: pixelated;
        }
        .video-item h3 {
            margin: 10px 0 5px 0;
            color: #333;
        }
        .video-item p {
            margin: 5px 0;
            color: #666;
            font-size: 14px;
        }
        .download-btn {
            background-color: #4CAF50;
            padding: 8px 15px;
            font-size: 14px;
            margin-top: 10px;
        }
        .download-btn:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            margin: 10px 0;
            padding: 10px;
            background-color: #ffe6e6;
            border-radius: 0px;
            border: 2px solid red;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid black;
            border-radius: 0px;
            margin: 0 auto;
            animation: blink 0.6s steps(1) infinite;
        }
        @keyframes blink {
            0% { background-color: black; }
            50% { background-color: transparent; }
        }
        .agent-reaction {
            background: #3a2a14;
            color: #FFD700;
            padding: 20px;
            border-radius: 0px;
            margin: 20px 0;
            border: 3px solid #FFD700;
            font-style: normal;
            font-size: 12px;
            box-shadow: 4px 4px 0px black;
        }
        .agent-reaction::before {
            content: "DWARVEN KING: ";
            font-style: normal;
            color: #fff;
        }

        /* THE SCENE */
        .scene {
            position: relative;
            height: 200px;
            margin: 30px 0 20px 0;
            overflow: hidden;
        }

        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background-color: black;
        }

        .character {
            position: absolute;
            bottom: 3px;
            width: 48px;
            height: 48px;
            background-color: #555;
            border: 2px solid black;
        }

        .hero {
            left: 30px;
        }

        .king {
            width: 56px;
            height: 64px;
            background-color: #8B4513;
        }

        .throne {
            position: absolute;
            bottom: 3px;
            right: 20px;
            width: 90px;
            height: 100px;
            border: 3px solid black;
            background-color: #3a2a14;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 0;
        }

        .speech-bubble {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border: 3px solid black;
            padding: 12px 16px;
            font-size: 10px;
            max-width: 300px;
            text-align: center;
        }

        .speech-bubble::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 12px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TROVE</h1>
        <h4>Ask and you shall receive</h4>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="What do you desire...?">
            <button onclick="search()">Search</button>
        </div>
        
        <div id="error"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>

        <!-- THE SCENE -->
        <div class="scene">
            <div class="character hero"></div>
            <div class="speech-bubble" id="agentSpeech">Awaiting your request...</div>
            <div class="throne">
                <div class="character king"></div>
            </div>
            <div class="ground"></div>
        </div>

        <div id="results"></div>
    </div>

    <script>
        // Function to search YouTube
        function search() {
            const searchTerm = document.getElementById('searchInput').value;
            const errorDiv = document.getElementById('error');
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');
            
            // Clear previous results
            errorDiv.innerHTML = '';
            resultsDiv.innerHTML = '';
            
            // Validate input
            if (!searchTerm.trim()) {
                errorDiv.innerHTML = '<div class="error">Please enter a search term</div>';
                return;
            }
            
            // Show loading spinner
            loadingDiv.style.display = 'block';
            
            // Send search request to Flask backend
            fetch('/api/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'search_term=' + encodeURIComponent(searchTerm)
            })
            .then(response => response.json())
            .then(data => {
                loadingDiv.style.display = 'none';
                
                if (data.error) {
                    errorDiv.innerHTML = '<div class="error">' + data.error + '</div>';
                    return;
                }
                
                // STAGE 1: Display initial reaction immediately
                if (data.initial_reaction) {
                    resultsDiv.innerHTML = '<div class="agent-reaction">' + data.initial_reaction + '</div>';
                }
                
                // STAGE 2: After 1 second, replace with full agent reaction and results
                setTimeout(() => {
                    resultsDiv.innerHTML = '';
                    
                    // Display proper agent reaction
                    if (data.agent_reaction) {
                        resultsDiv.innerHTML = '<div class="agent-reaction">' + data.agent_reaction + '</div>';
                    }
                    
                    // Display search results
                    data.results.forEach(video => {
                        const videoHtml = `
                            <div class="video-item">
                                <img src="${video.thumbnail}" alt="${video.title}">
                                <h3>${video.title}</h3>
                                <p><strong>Length:</strong> ${video.duration}</p>
                                <p><strong>Type:</strong> ${video.type}</p>
                                <p><strong>Channel:</strong> ${video.owner}</p>
                                <p><strong>Verified:</strong> ${video.verification}</p>
                                <p><strong>Published:</strong> ${video.published}</p>
                                <button class="download-btn" onclick="downloadAudio(this, '${video.link}')">Download Audio</button>
                            </div>
                        `;
                        resultsDiv.innerHTML += videoHtml;
                    });
                }, 1000);  // 1 second delay
            })
            .catch(error => {
                loadingDiv.style.display = 'none';
                errorDiv.innerHTML = '<div class="error">Error: ' + error + '</div>';
            });
        }
        
        // Function to download audio
        function downloadAudio(button, url) {
            const errorDiv = document.getElementById('error');
            const originalText = button.textContent;
            
            // Disable button and show loading state
            button.disabled = true;
            button.textContent = '⏳ Downloading...';
            button.style.opacity = '0.6';
            errorDiv.innerHTML = '';
            
            fetch('/api/download', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'url=' + encodeURIComponent(url)
            })
            .then(response => {
                // Check if the response is OK (200-299 status)
                if (!response.ok) {
                    // If error, try to parse as JSON
                    return response.json().then(data => {
                        throw new Error(data.error || 'Download failed');
                    });
                }
                // If OK, get the audio file as a blob
                return response.blob();
            })
            .then(blob => {
                // Create a temporary URL for the file
                const blobUrl = URL.createObjectURL(blob);
                // Create a fake link element
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = 'audio.m4a';  // Default filename
                // Trigger the download
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                // Clean up the temporary URL
                URL.revokeObjectURL(blobUrl);
                
                // Success state
                button.textContent = '✓ Downloaded!';
                button.style.backgroundColor = '#45a049';
                errorDiv.innerHTML = '<div class="error" style="background-color: #e6ffe6; color: green;">✓ File downloaded! Check your Downloads folder.</div>';
                
                // Reset button after 2 seconds
                setTimeout(() => {
                    button.disabled = false;
                    button.textContent = originalText;
                    button.style.opacity = '1';
                    button.style.backgroundColor = '';
                }, 2000);
            })
            .catch(error => {
                // Error state
                button.textContent = '✗ Failed';
                button.style.backgroundColor = '#ff6b6b';
                errorDiv.innerHTML = '<div class="error">Error: ' + error + '</div>';
                
                // Reset button after 2 seconds
                setTimeout(() => {
                    button.disabled = false;
                    button.textContent = originalText;
                    button.style.opacity = '1';
                    button.style.backgroundColor = '';
                }, 2000);
            });
        }        
        // Allow Enter key to search
        document.getElementById('searchInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                search();
            }
        });
    </script>
</body>
</html>
